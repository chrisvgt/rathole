[server]
bind_addr = "0.0.0.0:2333"
default_token = "use_a_long_random_token" # e.g. from `openssl rand -base64 32`

[server.transport]
type = "noise"
[server.transport.noise]
# The private key from `rathole --genkey`. Never use a key from the internet.
local_private_key = "generate_with_rathole_--genkey"

[server.services.foo1]
bind_addr = "0.0.0.0:5202"
