name: Rust

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "develop"]
  # Started by the Benchmark workflow for its pull requests
  workflow_dispatch:

concurrency:
  # Documentation suggests ${{ github.head_ref }}, but that's only available on pull_request/pull_request_target triggers, so using ${{ github.ref }}.
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the dev image
        uses: ./.github/actions/dev-image
      - name: Lint
        run: ./docker.sh lint
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: target/THIRD-PARTY-LICENSES.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ./docker.sh image
      # Fails if a shared library is missing in the runtime image
      - name: Run
        run: docker run --rm rathole:local --version

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the dev image
        uses: ./.github/actions/dev-image
      - uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-
      - name: Test
        run: ./docker.sh test
      - name: Build
        run: ./docker.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: rathole
          path: target/debug/rathole
