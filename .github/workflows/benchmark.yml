name: Benchmark

# Benchmarks every release since v0.5.0 against frp after a release is
# published and opens a pull request against develop with the new README
# table, charts and docs/benchmark-results.md.

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - name: Pick versions
        id: versions
        run: |
          # Releases since v0.5.0, newest first
          all=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed '/^v0\.5\.0$/q')
          newest=$(echo "$all" | head -n 2)
          {
            echo "all=$(echo $all)"
            echo "latest=$(echo "$newest" | head -n 1)"
            # The README shows the fork base and the last two releases
            echo "readme=$(echo $newest) v0.5.0"
            echo "charts=v0.5.0 $(echo $(echo "$newest" | tac))"
            echo "rust=$(rustc --version | cut -d ' ' -f 2)"
          } >> "$GITHUB_OUTPUT"

      # Tags do not change, so their binaries are only built once per Rust version
      - uses: actions/cache@v6
        with:
          path: target/bench-compare/bin
          key: bench-${{ steps.versions.outputs.rust }}-${{ steps.versions.outputs.latest }}
          restore-keys: bench-${{ steps.versions.outputs.rust }}-

      - name: Run the benchmark
        env:
          GH_TOKEN: ${{ github.token }}
          FRP_VERSIONS: latest 0.38.0
        run: |
          mkdir -p target
          benches/scripts/compare.sh ${{ steps.versions.outputs.all }} -- --rounds 3 \
            > target/bench-result.md 2> >(tee target/bench.log >&2)
          cat target/bench-result.md

      - name: Update the docs
        run: |
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          ram=$(awk '/^MemTotal:/ { printf "%.0f", $2 / 1048576 }' /proc/meminfo)
          python3 benches/scripts/update-docs.py \
            --result target/bench-result.md --log target/bench.log \
            --machine "GitHub Actions runner with $(nproc) vCPUs ($cpu) and $ram GB RAM, Linux" \
            --rust ${{ steps.versions.outputs.rust }} \
            --command 'FRP_VERSIONS="latest 0.38.0" benches/scripts/compare.sh ${{ steps.versions.outputs.all }} -- --rounds 3' \
            ${{ steps.versions.outputs.readme }}
          mapfile -t frp < <(grep -o '^| frp v[0-9.]*' target/bench-result.md | cut -c 3- | sort -u -V)
          python3 benches/scripts/charts.py docs/benchmark-results.md docs/img \
            ${{ steps.versions.outputs.charts }} "${frp[@]}"
          git diff --stat

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          branch="bench/$LATEST-$GITHUB_RUN_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add README.md docs/benchmark-results.md docs/img
          git commit -m "docs: update benchmark results for $LATEST"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "docs: update benchmark results for $LATEST" \
            --body "Benchmark of all releases since v0.5.0 and frp, run by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
