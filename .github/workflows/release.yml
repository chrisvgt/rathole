name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v7
      - name: Build the dev image
        uses: ./.github/actions/dev-image
      - name: Build and package
        run: ./docker.sh release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: rathole-${{ matrix.target }}
          path: |
            dist/rathole-${{ matrix.target }}.zip
            dist/rathole-${{ matrix.target }}.zip.sha256
      - name: Publish
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/rathole-${{ matrix.target }}.zip
            dist/rathole-${{ matrix.target }}.zip.sha256
          generate_release_notes: true
          body: |
            **TLS:** rustls is now the default, the release builds no longer need OpenSSL. PKCS#12 files from OpenSSL 3 work without `-legacy`, and a modified file or a wrong password is rejected. Build with the `native-tls` feature for the old behaviour.

            **New:** tokens and keys can be read from files with `token_file`, `default_token_file`, `local_private_key_file` and `pkcs12_password_file`, e.g. for Docker secrets or systemd credentials.

            **Fixed:** the config is reloaded when it is a symlink, e.g. a Kubernetes ConfigMap.

            **Docker:** images for amd64 and arm64 at `ghcr.io/chrisvgt/rathole`.

            Also: the systemd units in `examples/systemd` run as their own user with sandboxing, and outdated docs and examples were removed.

            No protocol change, compatible with 0.6.0 and later.
          draft: true
