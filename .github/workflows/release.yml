name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v7
      - name: Build the dev image
        uses: ./.github/actions/dev-image
      - name: Build and package
        run: ./docker.sh release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: rathole-${{ matrix.target }}
          path: |
            dist/rathole-${{ matrix.target }}.zip
            dist/rathole-${{ matrix.target }}.zip.sha256
      - name: Publish
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/rathole-${{ matrix.target }}.zip
            dist/rathole-${{ matrix.target }}.zip.sha256
          generate_release_notes: true
          body: |
            **New: reverse services.** With `mode = "reverse"` the server exposes one of its own local services (`local_addr`) and the client listens on `bind_addr`, e.g. to reach a dashboard on the VPS from the home LAN without opening a port or running a reverse proxy there. Works for TCP, UDP, `tcp+udp` and port ranges over every transport, with the same authentication as control channels. The target is fixed by the server config. See `examples/reverse`.

            **Fixed:** invalid Noise keys and Curve448 patterns are rejected at startup instead of panicking or being zero-padded. `--genkey x448` is removed, it never worked.

            **Platforms:** releases are Linux-only: x86_64 (gnu and musl), aarch64-musl and armv7-musleabihf. Windows, macOS, MIPS and ARMv6 builds are dropped.

            Also: development and CI run through `./docker.sh` without a local Rust toolchain, and dependencies are updated.

            Compatible with 0.6.0 and later. Reverse services need 0.7.0 on both server and client; existing configs are unaffected.
          draft: true
