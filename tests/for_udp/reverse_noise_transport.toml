# Reverse services: the server exposes its local services, the client listens
[client]
remote_addr = "127.0.0.1:2383"
default_token = "default_token_if_not_specify"

[client.transport]
type = "noise"
[client.transport.noise]
remote_public_key = "mEnUEACy9UrTBmwoCJb6fcKWBRdvfD9XzuBVsroOLFg="

[client.services.echo]
mode = "reverse"
type = "udp"
bind_addr = "127.0.0.1:2384"
[client.services.pingpong]
mode = "reverse"
type = "udp"
bind_addr = "127.0.0.1:2385"

[server]
bind_addr = "127.0.0.1:2383"
default_token = "default_token_if_not_specify"

[server.transport]
type = "noise"
[server.transport.noise]
local_private_key = "kQiSRtS3bs8BoGCJYgFnl1FLrTG1lV53Dj8jSjmg8tE="

[server.services.echo]
mode = "reverse"
type = "udp"
local_addr = "127.0.0.1:8102"
[server.services.pingpong]
mode = "reverse"
type = "udp"
local_addr = "127.0.0.1:8103"
