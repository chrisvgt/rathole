# Configuration for cargo-about, which lists the licenses of all crates
# compiled into rathole. The list ships as THIRD-PARTY-LICENSES.txt in the
# release zips.

# Accepted licenses, in order of preference for dual-licensed crates
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
]

# Only crates that end up in the binary
ignore-build-dependencies = true
ignore-dev-dependencies = true
