[package]
name = "rathole"
version = "0.6.5"
edition = "2021"
authors = ["Yujia Qiao <code@rapiz.me>"]
description = "A reverse proxy for NAT traversal"
license = "Apache-2.0"
repository = "https://github.com/chrisvgt/rathole"
readme = "README.md"
build = "build.rs"
include = ["src/**/*", "LICENSE", "NOTICE", "README.md", "build.rs"]

[features]
default = [
    "server",
    "client",
    "rustls",
    "noise",
    "websocket-rustls",
    "hot-reload",
]

# Run as a server
server = []
# Run as a client
client = []

# TLS support. rustls is the default, native-tls uses the OpenSSL of the system
native-tls = ["tokio-native-tls"]
rustls = [
    "tokio-rustls",
    "rustls-native-certs",
    "p12-keystore",
]

# Noise support
noise = ["snow", "base64"]

# Websocket support
websocket-native-tls = [
    "tokio-tungstenite",
    "tokio-util",
    "futures-core",
    "futures-sink",
    "native-tls",
]
websocket-rustls = [
    "tokio-tungstenite",
    "tokio-util",
    "futures-core",
    "futures-sink",
    "rustls",
]

# Configuration hot-reload support
hot-reload = ["notify"]

# Features of the release builds for routers and other embedded devices. TLS
# would make them about 60 % larger, use noise there
embedded = ["server", "client", "hot-reload", "noise"]

# Feature to enable tokio-console. Disabled by default.
# Don't enable it unless for debugging purposes.
console = ["console-subscriber", "tokio/tracing"]

# Tunnel benchmark, only runs with `cargo bench --bench tunnel`
[[bench]]
name = "tunnel"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = 1

[profile.minimal]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = { version = "1", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.11"
postcard = { version = "1", default-features = false, features = ["use-std"] }
lazy_static = "1.4"
hex = "0.4"
subtle = "2"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = { version = "0.6", features = ["all"] }
fdlimit = "0.2"
async-trait = "0.1"
# ring has assembly for ChaChaPoly and AES-GCM, about twice as fast as the
# pure Rust ciphers on CPUs without AVX2
snow = { version = "0.9", optional = true, features = ["ring-accelerated"] }
base64 = { version = "0.22", optional = true }
notify = { version = "8", optional = true }
console-subscriber = { version = "0.5", optional = true, features = [
    "parking_lot",
] }
async-http-proxy = { version = "1.2", features = [
    "runtime-tokio",
    "basic-auth",
] }
async-socks5 = "0.6"
url = { version = "2.2", features = ["serde"] }
tokio-tungstenite = { version = "0.30.0", optional = true }
tokio-util = { version = "0.7.9", optional = true, features = ["io"] }
futures-core = { version = "0.3.28", optional = true }
futures-sink = { version = "0.3.28", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
# ring like noise, aws-lc does not build for every release target
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
rustls-native-certs = { version = "0.8", optional = true }
p12-keystore = { version = "0.4", optional = true }

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
# Only to test that the noise transport still talks to v0.6.3 and older
snowstorm = { version = "0.4", features = ["stream"], default-features = false }

[build-dependencies]
anyhow = "1.0"
vergen-gitcl = { version = "10", features = ["build", "cargo"] }
